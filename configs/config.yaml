# ============================================================
# Acoustic PDM — Centralized Pipeline Configuration
# ============================================================
# All hyperparameters for the entire pipeline live here.
# Source modules read from this file — never hardcode values.
# ============================================================

# ── Audio I/O ──
audio:
  sample_rate: 16000        # Hz — MIMII native sample rate
  channels: 1               # Mono (channel 0 of the 8-mic array)
  bit_depth: 16             # 16-bit PCM WAV
  clip_duration_sec: 10     # Each MIMII clip is ~10 seconds

# ── Feature Extraction ──
features:
  n_fft: 1024               # FFT window size (64 ms at 16 kHz)
  hop_length: 512           # Hop between windows (32 ms, 50% overlap)
  n_mels: 128               # Number of Mel frequency bins
  fmin: 0                   # Lowest Mel frequency (Hz)
  fmax: null                # Highest Mel frequency (null = sr/2 = 8000 Hz)
  power_to_db: true         # Convert power spectrogram to dB scale
  context_frames: 5         # Group 5 consecutive time frames → (128, 5) blocks

# ── Normalization ──
normalization:
  method: "zscore"          # Z-score: (X - μ) / (σ + ε)
  epsilon: 1.0e-8           # Prevent division by zero in normalization

# ── Data ──
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  machine_types:
    - "fan"
    - "pump"
    - "slider"
    - "valve"
  machine_ids: ["id_00"]
  snr_levels: ["6_dB"]
  test_split: 0.1           # 10% of normal clips held out for validation

# ── Kaggle ──
kaggle:
  dataset_slug: "daisukelab/dc2020task2"
  kaggle_input_root: "/kaggle/input/dc2020task2"

# ── Local Sample (for laptop testing) ──
local_sample:
  clips_per_category: 50    # Download only 50 clips per (machine, condition)
  total_target_mb: 80       # Approximate total size target

# ── Training ──
training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 1.0e-5
  epochs: 50
  early_stopping_patience: 10
  random_seed: 42
  num_workers: 2            # DataLoader workers (0 on Windows if issues)

# ── Model: Autoencoder ──
model_ae:
  latent_dim: 32
  encoder_channels: [1, 32, 64, 128]
  kernel_size: 3
  stride: 2
  padding: 1
  activation: "leaky_relu"

# ── Model: Variational Autoencoder (Stage B) ──
model_vae:
  latent_dim: 32
  beta: 1.0                 # KL divergence weight (β-VAE)
  encoder_channels: [1, 32, 64, 128]

# ── Evaluation ──
evaluation:
  threshold_percentile: 95  # θ = 95th percentile of normal validation scores
  reports_dir: "reports"

# ── Paths ──
paths:
  models_dir: "models"
  scripts_dir: "scripts"
  reports_dir: "reports"
